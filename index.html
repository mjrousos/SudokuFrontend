<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict-ish CSP. connect-src needs to allow the backend; we keep it
         open here for flexibility across environments, but production
         deployments should override it to a specific API host. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https:; base-uri 'self'; frame-ancestors 'none';"
    />
    <!-- Theme initializer must run BEFORE the app mounts so the saved
         preference is applied to <html> with no flash of the wrong theme.
         CSP disallows inline scripts, so this lives in /public and is
         referenced as an external file. Kept in sync with
         src/shared/composables/useTheme.ts. -->
    <script src="/theme-init.js"></script>
    <title>Sudoku</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
