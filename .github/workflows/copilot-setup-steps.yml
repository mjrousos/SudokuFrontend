name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install GitHub MCP Server
        run: |
          go install github.com/github/github-mcp-server/cmd/github-mcp-server@sammorrowdrums-github-app-s2s-auth
          github-mcp-server stdio --help

      - name: Install GitHub MCP Router
        run: |
          go install github.com/mjrousos/GitHubMcpRouter/cmd/mcp-router@latest
          mcp-router --help

      - name: Start GitHub MCP Router
        run: |
          GITHUB_APP_ID="$MCP_ROUTER_APP_ID"
          GITHUB_APP_PRIVATE_KEY="$MCP_ROUTER_APP_PRIVATE_KEY"
          export GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY

          if [[ -z "$GITHUB_APP_ID" || -z "$GITHUB_APP_PRIVATE_KEY" ]]; then
            echo "::notice::Skipping GitHub MCP Router startup because Copilot cloud agent credentials are unavailable."
            exit 0
          fi

          nohup mcp-router http > /tmp/mcp-router.log 2>&1 &
