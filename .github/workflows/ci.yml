name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:cov
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The E2E suite is an integration suite against the private SudokuBackend, so
  # it only runs when a token that can read that repo is configured
  # (BACKEND_REPO_TOKEN). Without it, E2E is skipped so CI stays green (e.g. on
  # forks or before the secret is added). `secrets` can't be referenced in a
  # job-level `if:`, so this tiny job surfaces availability as an output.
  backend-access:
    name: Check backend access
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -n "$BACKEND_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BACKEND_REPO_TOKEN not configured — skipping end-to-end tests (they require the private SudokuBackend repository)."
          fi

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [unit, build, backend-access]
    # Skip cleanly when no backend token is configured (see backend-access).
    if: needs.backend-access.outputs.available == 'true'
    # E2E requires the SudokuBackend repository to be checked out alongside
    # this one (as ../SudokuBackend) and Docker available on the runner.
    steps:
      - uses: actions/checkout@v7
        with:
          path: SudokuFrontend
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SudokuBackend
          path: SudokuBackend
          # SudokuBackend is private; the default GITHUB_TOKEN cannot read another
          # repository. Use a PAT or GitHub App token with Contents: read on it.
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SudokuFrontend/package-lock.json
      - name: Install dependencies
        working-directory: SudokuFrontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('SudokuFrontend/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: SudokuFrontend
        run: npx playwright install --with-deps chromium
      # Playwright's webServer runs `vite preview`, which requires a built dist/.
      # Reuse the dist artifact uploaded by the `build` job instead of rebuilding.
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: SudokuFrontend/dist
      - name: Start backend
        working-directory: SudokuBackend
        run: |
          # The SudokuBackend docker-compose.yml has no env_file, so a plain
          # `.env` is only used by Compose for YAML interpolation and never
          # reaches the container. Write a dedicated `docker-compose.e2e.yml`
          # and pass it explicitly via `-f` rather than the auto-merged
          # `docker-compose.override.yml`, to keep parity with the local dev
          # helper (`scripts/ensure-backend.ps1`) and avoid implying we'd
          # clobber a developer's local override file. This injects the env
          # the api container needs:
          #
          # * Cors__AllowedOrigins lets the browser at http://localhost:5173
          #   (vite preview) call the api at http://localhost:8080.
          #
          # * ASPNETCORE_ENVIRONMENT=Testing flips the explicit escape hatches
          #   in Program.cs (`if (!app.Environment.IsEnvironment("Testing"))`)
          #   that disable the per-remote-IP rate limiter and HTTPS redirect.
          #   The rate limiter partitions by `Connection.RemoteIpAddress`,
          #   which under docker's bridge network is the gateway IP for every
          #   test — i.e. one shared bucket of 10 requests/minute. Disabling
          #   it is what these E2E tests are designed to expect.
          cat > docker-compose.e2e.yml <<'YAML'
          services:
            api:
              environment:
                ASPNETCORE_ENVIRONMENT: Testing
                Cors__AllowedOrigins__0: http://localhost:5173
                Cors__AllowedOrigins__1: http://localhost:4173
          YAML
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then echo "Backend ready"; exit 0; fi
            sleep 2
          done
          echo "Backend never became ready"; exit 1
      - name: Run Playwright tests
        working-directory: SudokuFrontend
        env:
          # Backend is brought up in the prior step; skip the duplicate
          # docker-compose invocation inside globalSetup.
          E2E_SKIP_BACKEND: '1'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: SudokuFrontend/playwright-report/
