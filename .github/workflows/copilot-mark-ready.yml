# Plain (non-agentic) GitHub Actions workflow — the deterministic replacement for the
# former copilot-mark-ready.md agentic workflow. Promoting a draft PR to ready-for-review
# when its [WIP] title prefix is removed needs no AI, so it runs as a normal Action.
#
# WHY A SCHEDULE (and not pull_request):
# GitHub does not run Actions automatically on events triggered by the Copilot coding
# agent (the "Approve and run workflows" gate). That gate keys on the *triggering actor*
# being Copilot, so it applies to `pull_request` AND `pull_request_target` alike and
# cannot be disabled by a setting on a public repo. A scheduled run is triggered by
# GitHub's scheduler (not Copilot), runs in the trusted base context, and is therefore
# never subject to that gate — so this marks PRs ready with no human interaction.
#
# It marks the PR ready using the GH_AW_GITHUB_TOKEN PAT (not the default GITHUB_TOKEN) so
# the resulting `ready_for_review` event is authored by a real user and chains to the
# copilot-request-review agentic workflow, which requests the Copilot reviewer. A
# GITHUB_TOKEN-authored ready event would not trigger that follow-on workflow.
# See README ("Automated Copilot PR review") for the token and its scopes.
name: Mark Copilot PRs ready when WIP removed

on:
  # Poll every ~5 minutes. Cron is triggered by GitHub (a non-Copilot actor), which is
  # what lets this bypass the Copilot workflow-approval gate. GitHub may add a few minutes
  # of delay to scheduled runs under load.
  schedule:
    - cron: "*/5 * * * *"
  # Allow manual runs from the Actions tab for testing (write-user dispatch is not gated).
  workflow_dispatch: {}

# All GitHub calls below use the PAT (GH_TOKEN), so the built-in GITHUB_TOKEN needs no
# elevated scope. Keep it read-only.
permissions:
  contents: read

# Never let two scans overlap.
concurrency:
  group: mark-copilot-prs-ready
  cancel-in-progress: false

jobs:
  mark-ready:
    name: Mark eligible Copilot draft PRs ready for review
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_AW_GITHUB_TOKEN is configured
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_AW_GITHUB_TOKEN" ]; then
            echo "GH_AW_GITHUB_TOKEN secret is required (do not fall back to GITHUB_TOKEN)." >&2
            exit 1
          fi
      - name: Mark eligible Copilot draft PRs ready
        env:
          # PAT so each `gh pr ready` emits a user-authored ready_for_review event that
          # chains to copilot-request-review.
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          # Prevent gh from silently falling back to the workflow's built-in token.
          GITHUB_TOKEN: ""
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Eligible = open, draft, authored by the Copilot coding agent, and whose title
          # no longer contains [WIP]. (`gh` reports the agent's author login as
          # `app/copilot-swe-agent`; the others are accepted for robustness across API
          # surfaces.) Restricting to Copilot authorship keeps human WIP drafts untouched.
          # Once a PR is marked ready it is no longer a draft, so it is not re-processed.
          numbers="$(
            gh pr list --repo "$REPO" --state open --draft --limit 100 \
              --json number,title,author \
              --jq '.[]
                | select(.author.login == "app/copilot-swe-agent"
                      or .author.login == "copilot-swe-agent[bot]"
                      or .author.login == "Copilot")
                | select((.title | test("\\[WIP\\]")) | not)
                | .number'
          )"

          if [ -z "$numbers" ]; then
            echo "No eligible Copilot draft PRs to mark ready."
            exit 0
          fi

          echo "Eligible PRs: $numbers"
          for pr in $numbers; do
            echo "Marking PR #$pr ready for review..."
            gh pr ready "$pr" --repo "$REPO"
          done
